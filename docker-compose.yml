services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000,capacitor://localhost,http://localhost
      - DATABASE_PATH=/app/data/medical_ai.sqlite3
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5.6-sol}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT:-low}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY:-}
    volumes:
      - medical_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  medical_data:
